<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fullscreen Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: ui-monospace, 'Courier New', monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    position: fixed;
    inset: 0;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  #box {
    flex: 1;
    background: linear-gradient(135deg, #1a1a2e, #2a1a3e);
    border: 2px solid #ff66bb;
    margin: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 16px;
    border-radius: 8px;
  }
  h1 { margin: 0; color: #ff66bb; font-size: 18px; letter-spacing: 0.1em; }
  button {
    background: #ff66bb22;
    border: 1px solid #ff66bb;
    color: #ff88cc;
    padding: 12px 18px;
    font: inherit;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    min-width: 200px;
  }
  button:active { background: #ff66bb44; }
  .row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  #log {
    flex: 0 0 auto;
    height: 35vh;
    overflow: auto;
    background: #000;
    color: #00ff99;
    font-size: 11px;
    padding: 8px;
    margin: 0 8px 8px 8px;
    border: 1px solid #00ff9933;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ok  { color: #00ff99; }
  .warn { color: #ffee44; }
  .err { color: #ff5566; }
  .info { color: #66ddff; }
  small { color: #888; font-size: 10px; }
  :fullscreen,
  :-webkit-full-screen {
    background: #001a0a;
  }
  :fullscreen #box,
  :-webkit-full-screen #box {
    border-color: #00ff99;
  }
</style>
</head>
<body>

<div id="app">
  <div id="box">
    <h1>FULLSCREEN TEST</h1>
    <div id="status" style="font-size:12px;color:#aaa;"></div>
    <div class="row">
      <button id="b1">1. Standard requestFullscreen(box)</button>
      <button id="b2">2. webkitRequestFullscreen(box)</button>
      <button id="b3">3. requestFullscreen(documentElement)</button>
      <button id="b4">4. webkitRequestFullscreen(documentElement)</button>
      <button id="b5">5. Hidden &lt;video&gt; webkitEnterFullscreen</button>
      <button id="b6">6. Exit fullscreen</button>
      <button id="b7" style="background:#00ff9922;border-color:#00ff99;color:#88ffcc;">Lock orientation landscape</button>
      <button id="b8" style="background:#ffee4422;border-color:#ffee44;color:#ffee88;">Clear log</button>
    </div>
    <small id="hint"></small>
  </div>
  <div id="log"></div>
</div>

<!-- hidden video for iOS fullscreen fallback -->
<video id="fsvideo" playsinline muted loop preload="auto" style="position:fixed;left:-9999px;width:1px;height:1px;">
  <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAghtZGF0AAACrwYF//+r3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjcyMSBhY2RlNjQ2IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNiAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTEgcmVmPTMgZGVibG9jaz0xOjA6MCBhbmFseXNlPTB4MzoweDExMyBtZT1oZXggc3VibWU9NyBwc3k9MSBwc3lfcmQ9MS4wMDowLjAwIG1peGVkX3JlZj0xIG1lX3JhbmdlPTE2IGNocm9tYV9tZT0xIHRyZWxsaXM9MSA4eDhkY3Q9MSBjcW09MCBkZWFkem9uZT0yMSwxMSBmYXN0X3Bza2lwPTEgY2hyb21hX3FwX29mZnNldD0tMiB0aHJlYWRzPTYgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTIga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAAwZYiEAD//8m+P5OXfBeLGOfKE3xkODvFZuBflHv/+VwJIta6cbpIo4ABLoKBaYrCIQADIAAAB0AAAAAGZjdHRzAAAAAAAAAAEAAAABAAAEAAAAAB1zdHN6AAAAAAAAAAAAAAABAAAACgAAABgAAAARAAAAFHN0Y28AAAAAAAAAAQAAACwAAABhdWR0YQAAAFlsdWR0YQAAAFFtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAACR0ZW5pAAAAFHNvZnRoYW5kbGVy"/>
</video>

<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
const hint = document.getElementById('hint');
const box = document.getElementById('box');
const fsvideo = document.getElementById('fsvideo');

function L(msg, cls='') {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = `[${time}] ${msg}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function updateStatus() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  status.innerHTML =
    `fullscreen element: <span class="${fs?'ok':'err'}">${fs ? fs.tagName : 'none'}</span><br>` +
    `standalone (PWA): <span class="${standalone?'ok':'warn'}">${standalone}</span><br>` +
    `viewport: ${window.innerWidth}×${window.innerHeight}`;
}

// detect environment
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isIPhone = /iPhone/.test(ua);
const isSafari = /^((?!chrome|android).)*safari/i.test(ua);

L(`UA: ${ua}`, 'info');
L(`Platform: ${navigator.platform}, touch: ${navigator.maxTouchPoints || 0}`, 'info');
L(`Detected: iOS=${isIOS}, iPhone=${isIPhone}, Safari=${isSafari}`, 'info');
L(`box.requestFullscreen: ${typeof box.requestFullscreen}`, box.requestFullscreen ? 'ok' : 'err');
L(`box.webkitRequestFullscreen: ${typeof box.webkitRequestFullscreen}`, box.webkitRequestFullscreen ? 'ok' : 'err');
L(`doc.documentElement.requestFullscreen: ${typeof document.documentElement.requestFullscreen}`, document.documentElement.requestFullscreen ? 'ok' : 'err');
L(`fsvideo.webkitEnterFullscreen: ${typeof fsvideo.webkitEnterFullscreen}`, fsvideo.webkitEnterFullscreen ? 'ok' : 'err');

if (isIPhone && isSafari) {
  hint.innerHTML = '⚠ iPhone Safari may not support Fullscreen API for non-video elements.<br>Try button 5 (video fallback) or "Add to Home Screen" for PWA mode.';
}

updateStatus();

function tryAndLog(label, fn) {
  L(`→ Trying: ${label}`, 'info');
  try {
    const result = fn();
    if (result && typeof result.then === 'function') {
      result.then(() => L(`✓ ${label} resolved`, 'ok'))
            .catch(e => L(`✗ ${label} rejected: ${e.name}: ${e.message}`, 'err'));
    } else {
      L(`✓ ${label} returned (sync)`, 'ok');
    }
  } catch(e) {
    L(`✗ ${label} threw: ${e.name}: ${e.message}`, 'err');
  }
  setTimeout(updateStatus, 200);
  setTimeout(updateStatus, 800);
}

document.getElementById('b1').addEventListener('click', () => {
  tryAndLog('box.requestFullscreen()', () => box.requestFullscreen());
});
document.getElementById('b2').addEventListener('click', () => {
  tryAndLog('box.webkitRequestFullscreen()', () => box.webkitRequestFullscreen());
});
document.getElementById('b3').addEventListener('click', () => {
  tryAndLog('documentElement.requestFullscreen()', () => document.documentElement.requestFullscreen());
});
document.getElementById('b4').addEventListener('click', () => {
  tryAndLog('documentElement.webkitRequestFullscreen()', () => document.documentElement.webkitRequestFullscreen());
});
document.getElementById('b5').addEventListener('click', async () => {
  L('→ Trying: video.webkitEnterFullscreen()', 'info');
  try {
    // need to play silently first on iOS
    fsvideo.muted = true;
    fsvideo.playsInline = false; // necessary: playsInline blocks fullscreen
    try { await fsvideo.play(); L('  video.play() ok', 'ok'); } catch(e) { L('  play err: ' + e.message, 'warn'); }
    if (typeof fsvideo.webkitEnterFullscreen === 'function') {
      fsvideo.webkitEnterFullscreen();
      L('✓ called webkitEnterFullscreen', 'ok');
    } else {
      L('✗ webkitEnterFullscreen unavailable', 'err');
    }
  } catch(e) { L('✗ ' + e.message, 'err'); }
});
document.getElementById('b6').addEventListener('click', () => {
  tryAndLog('exit', () => {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if (fsvideo.webkitExitFullscreen) fsvideo.webkitExitFullscreen();
    throw new Error('no exit method');
  });
});
document.getElementById('b7').addEventListener('click', () => {
  tryAndLog('screen.orientation.lock(landscape)', () => screen.orientation.lock('landscape'));
});
document.getElementById('b8').addEventListener('click', () => {
  log.innerHTML = '';
  L('log cleared', 'info');
});

// listen to fullscreen events
['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(ev => {
  document.addEventListener(ev, () => {
    L(`event: ${ev}`, 'ok');
    updateStatus();
  });
});
document.addEventListener('fullscreenerror', e => L(`event: fullscreenerror`, 'err'));
document.addEventListener('webkitfullscreenerror', e => L(`event: webkitfullscreenerror`, 'err'));

// detect orientation changes
window.addEventListener('resize', updateStatus);
window.addEventListener('orientationchange', () => {
  L(`orientationchange → ${window.innerWidth}×${window.innerHeight}`, 'info');
  updateStatus();
});
</script>
</body>
</html>
